name: Build Erdin Klavye APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK paketlerini hazırla
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Birim testlerini çalıştır
        run: gradle testDebugUnitTest
      - name: APK derle
        run: gradle assembleDebug
      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: erdin-klavye-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
